# 本地开发依赖服务：MySQL + Redis + EMQX。
# 用法：docker compose --env-file .env.dev -f docker-compose.dev.yml up -d
# 宿主机端口全部来自 .env.dev：无默认值，未设置 compose 会直接报错。
# 应用直接读取同一批环境变量；账号与库名和应用默认值保持一致。

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MYSQL_PORT:?请在 .env.dev 中设置 MYSQL_PORT}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:?请在 .env.dev 中设置 MYSQL_DEV_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stupig_tv}
      MYSQL_USER: ${MYSQL_USER:-stupig_tv}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.dev 中设置 MYSQL_PASSWORD}
      TZ: UTC
    # 与生产一致：连接时区强制 UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:?请在 .env.dev 中设置 REDIS_PORT}:6379'

  emqx:
    # 与生产固定同一版本；升级前备份现有数据与认证配置。
    image: emqx/emqx:6.2.2
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/emqx/etc/dev-entrypoint.sh
    command:
      - /opt/emqx/bin/emqx
      - foreground
    ports:
      # 仅回环：这些端口只给本机开发用，不该暴露到局域网。
      # Dashboard 同理：默认 admin/public 是众所周知凭据，别对外开。
      - '127.0.0.1:${MQTT_TCP_PORT:?请在 .env.dev 中设置 MQTT_TCP_PORT}:1883' # TCP，服务端 publish 用
      - '127.0.0.1:${MQTT_WS_PORT:?请在 .env.dev 中设置 MQTT_WS_PORT}:8083' # WebSocket，浏览器 useDataSync 用
      - '127.0.0.1:${EMQX_DEV_DASHBOARD_PORT:?请在 .env.dev 中设置 EMQX_DEV_DASHBOARD_PORT}:18083' # Dashboard（admin/public）
    environment:
      # Dashboard 管理密码，HOCON 值要带内层双引号，否则含 # 的字符串会被截断成注释。
      # 仅本机回环，仍然改掉默认值：本地网络里的其他进程也可能扫到 18083。
      EMQX_DASHBOARD__DEFAULT_PASSWORD: '"public"'
      # 初始化发布账号；凭据来自同一份 .env.dev，启动脚本生成容器内 bootstrap JSON。
      MQTT_USERNAME: ${MQTT_USERNAME:?请在 .env.dev 中设置 MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?请在 .env.dev 中设置 MQTT_PASSWORD}
      # 认证器：首次启动导入账号，密码哈希存内置 Mnesia 库。
      # 数组索引语法 EMQX_AUTHENTICATION__1__* 对应 EMQX 的 authentication 数组第 1 项。
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/etc/dev-auth-bootstrap.json
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: sha256
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__SALT_POSITION: suffix
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE_AUTHN: 'true'
      EMQX_LISTENERS__TCP__DEFAULT__ZONE: default
      EMQX_LISTENERS__WS__DEFAULT__ENABLE_AUTHN: 'false'
      EMQX_LISTENERS__WS__DEFAULT__ZONE: default
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: file
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: true
      EMQX_AUTHORIZATION__SOURCES__1__PATH: /opt/emqx/etc/acl.conf
    volumes:
      # 挂一份固定的 ACL：规则是代码的一部分，不该靠 Dashboard 手点。
      - ./emqx-acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./scripts/dev/emqx-entrypoint.sh:/opt/emqx/etc/dev-entrypoint.sh:ro

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PHPMYADMIN_DEV_PORT:?请在 .env.dev 中设置 PHPMYADMIN_DEV_PORT}:80'
    environment:
      PMA_HOST: mysql
      # 免登录直接进（仅本地开发，别带去服务器）
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD}
    depends_on:
      - mysql

volumes:
  mysql-data:
