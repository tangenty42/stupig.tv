# 本地开发依赖服务：MySQL + Redis + EMQX。
# 用法：docker compose -f docker-compose.dev.yml up -d
# 连接信息已在 config/development.yaml 覆盖为 127.0.0.1。

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stupig_tv
      MYSQL_USER: stupig_tv
      MYSQL_PASSWORD: stupig_tv
      TZ: UTC
    # 与生产一致：连接时区强制 UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  emqx:
    image: emqx/emqx:5
    restart: unless-stopped
    ports:
      - '1883:1883' # TCP，服务端 publish 用
      - '8083:8083' # WebSocket，浏览器 useDataSync 用
      - '18083:18083' # Dashboard（admin/public）
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    ports:
      - '8081:80'
    environment:
      PMA_HOST: mysql
      # 免登录直接进（仅本地开发，别带去服务器）
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql-data:
