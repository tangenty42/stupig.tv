# 本地开发依赖服务：MySQL + Redis + EMQX。
# 用法：docker compose -f docker-compose.dev.yml up -d
# 宿主机端口全部来自 .env：无默认值，未设置 compose 会直接报错。
# config/*.yaml 引用同一批变量——改端口只改 .env，两处自动一致。
# MySQL 的账号密码同样来自 .env，经下方 environment 注入容器，与
# config/development.yaml 里插值出的连接密码永远一致。

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:?请在 .env 中设置 MYSQL_PORT}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_DEV_ROOT_PASSWORD}
      MYSQL_DATABASE: stupig_tv
      MYSQL_USER: stupig_tv
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: UTC
    # 与生产一致：连接时区强制 UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:?请在 .env 中设置 REDIS_PORT}:6379'

  emqx:
    # emqx/emqx 没有 :5 浮动标签,只能用具体版本(5.x 最新稳定版)
    image: emqx/emqx:5.10.5
    restart: unless-stopped
    ports:
      - '${MQTT_TCP_PORT:?请在 .env 中设置 MQTT_TCP_PORT}:1883' # TCP，服务端 publish 用
      - '${MQTT_WS_PORT:?请在 .env 中设置 MQTT_WS_PORT}:8083' # WebSocket，浏览器 useDataSync 用
      - '${EMQX_DEV_DASHBOARD_PORT:?请在 .env 中设置 EMQX_DEV_DASHBOARD_PORT}:18083' # Dashboard（admin/public）
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    ports:
      - '${PHPMYADMIN_DEV_PORT:?请在 .env 中设置 PHPMYADMIN_DEV_PORT}:80'
    environment:
      PMA_HOST: mysql
      # 免登录直接进（仅本地开发，别带去服务器）
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD}
    depends_on:
      - mysql

volumes:
  mysql-data:
