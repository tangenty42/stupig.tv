%% EMQX 5.x ACL：规则从上到下匹配，第一条命中即生效。
%% 服务端进程（clientId 前缀 server_）允许发布和订阅 stupig/sync/# 下的所有主题；
%% 浏览器（clientId 前缀 web_）只允许订阅，不能发布。
%% 其余一律拒绝（authorization.no_match=deny 兜底）。

%% 服务端：读写应用主题
{allow, {client, {re, "^server_"}}, all, ["stupig/sync/#"]}.

%% 浏览器：只读订阅
{allow, {client, {re, "^web_"}}, subscribe, ["stupig/sync/#"]}.
