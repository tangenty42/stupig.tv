# 服务器端编排：应用容器接入外部 Docker 网络（EXTERNAL_DOCKER_NETWORK，
# 当前为 1panel 的网络），直连该网络里的 MySQL / Redis / EMQX。
# .env 放本文件旁边，密钥由 compose 注入容器，不进镜像。
#
# 这份文件是唯一的副本：CD 会在 `docker compose pull` 之前把它送到服务器
# ${DEPLOY_DIR}，并把服务器上的旧文件留成 docker-compose.yml.bak（见
# scripts/deploy-remote.sh）。所以改这里就等于改线上，不需要手工同步 —— 反过来，
# 服务器上直接改这份文件会被下一次部署覆盖。

services:
  app:
    image: ${ACR_IMAGE}:latest
    # 固定容器名：1panel 定时任务靠它 docker exec 跑维护脚本
    container_name: stupig-tv
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT}
      # 浏览器侧的 MQTT 地址不需要在这里映射：镜像自带的 docker-entrypoint.sh 会用
      # .env 里的 MQTT_WEB_URL 派生 NUXT_PUBLIC_MQTT_WEB_URL（不经 compose 也能工作，
      # 由镜像构建时的实测覆盖）。
    ports:
      # 只绑回环，外部流量由 openresty 反代进来
      - 127.0.0.1:${APP_PORT}:${APP_PORT}
    healthcheck:
      # 探 /healthz 而不是 /：首页 SSR 渲染成功不代表数据库可用。镜像自带一份等价的
      # HEALTHCHECK，这里保留一份是为了能按 .env 的 APP_PORT 插值（镜像里只能运行时
      # 读 PORT）。端口必须用 compose 插值，别写成 ${process.env.APP_PORT}：compose
      # 会先按自己的格式解析而报错。
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:${APP_PORT}/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
      # 涵盖启动前的迁移（CMD 先 migrate 再起服务），太短会把慢启动误判为不健康
      start_period: 120s

networks:
  default:
    name: ${EXTERNAL_DOCKER_NETWORK:?请在 .env 中设置 EXTERNAL_DOCKER_NETWORK}
    external: true
