# 服务器端编排：应用容器接入外部 Docker 网络（EXTERNAL_DOCKER_NETWORK，
# 当前为 1panel 的网络），直连该网络里的 MySQL / Redis / EMQX。
# .env 放本文件旁边，密钥由 compose 注入容器，不进镜像。

services:
  app:
    image: ${ACR_IMAGE}:latest
    # 固定容器名：1panel 定时任务靠它 docker exec 跑维护脚本
    container_name: stupig-tv
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT}
      # 浏览器侧的 MQTT 地址不需要在这里映射：镜像自带的 docker-entrypoint.sh 会用
      # .env 里的 MQTT_WEB_URL 派生 NUXT_PUBLIC_MQTT_WEB_URL（CI 只推镜像，compose
      # 文件在服务器上单独维护，映射写在这里会与镜像走岔）。
    ports:
      # 只绑回环，外部流量由 openresty 反代进来
      - 127.0.0.1:${APP_PORT}:${APP_PORT}
    healthcheck:
      # 端口由 compose 从 .env 的 APP_PORT 插值（与上面的 PORT / ports 同源），
      # 别写成容器内的 ${process.env.APP_PORT}：compose 会先按自己的格式解析而报错
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:${APP_PORT}/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: ${EXTERNAL_DOCKER_NETWORK:?请在 .env 中设置 EXTERNAL_DOCKER_NETWORK}
    external: true
