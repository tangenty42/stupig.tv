# 服务器端编排：应用容器接入外部 Docker 网络（EXTERNAL_DOCKER_NETWORK，
# 当前为 1panel 的网络），直连该网络里的 MySQL / Redis；EMQX 由本项目管理。
# .env.prod 放本文件旁边，密钥由 compose 注入容器，不进镜像。
#
# 这份文件是唯一的副本：CD 会在 `docker compose pull` 之前把它送到服务器
# ${DEPLOY_DIR}，并把服务器上的旧文件留成 docker-compose.yml.bak（见
# scripts/deploy/remote.sh）。所以改这里就等于改线上，不需要手工同步 —— 反过来，
# 服务器上直接改这份文件会被下一次部署覆盖。

services:
  app:
    image: ${APP_IMAGE:-${ACR_IMAGE}:latest}
    # 固定容器名：1panel 定时任务靠它 docker exec 跑维护脚本
    container_name: stupig-tv
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT}
      MQTT_HOST: emqx
      MQTT_TCP_PORT: 1883
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - default
      - mqtt
    ports:
      # 只绑回环，外部流量由 openresty 反代进来
      - 127.0.0.1:${APP_PORT}:${APP_PORT}
    healthcheck:
      # 探 /healthz 而不是 /：首页 SSR 渲染成功不代表数据库可用。镜像自带一份等价的
      # HEALTHCHECK，这里保留一份是为了能按 .env.prod 的 APP_PORT 插值（镜像里只能运行时
      # 读 PORT）。端口必须用 compose 插值，别写成 ${process.env.APP_PORT}：compose
      # 会先按自己的格式解析而报错。
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:${APP_PORT}/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      # 涵盖启动前的迁移（CMD 先 migrate 再起服务），太短会把慢启动误判为不健康
      start_period: 120s

  emqx:
    image: ${MQTT_IMAGE:-${ACR_IMAGE}:mqtt}
    restart: unless-stopped
    environment:
      EMQX_NODE__NAME: stupig@127.0.0.1
      MQTT_USERNAME: ${MQTT_USERNAME:?请在 .env.prod 中设置 MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?请在 .env.prod 中设置 MQTT_PASSWORD}
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /tmp/stupig-auth-bootstrap.json
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: sha256
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__SALT_POSITION: suffix
      EMQX_AUTHENTICATION__2__MECHANISM: password_based
      EMQX_AUTHENTICATION__2__BACKEND: http
      EMQX_AUTHENTICATION__2__METHOD: post
      EMQX_AUTHENTICATION__2__URL: http://app:${APP_PORT}/api/content-draft-sync/authenticate
      EMQX_AUTHENTICATION__2__HEADERS: '{"content-type":"application/json"}'
      EMQX_AUTHENTICATION__2__BODY: '{"username":"$${username}","password":"$${password}"}'
      EMQX_AUTHENTICATION__2__REQUEST_TIMEOUT: 3s
      EMQX_LISTENERS__WS__DRAFTS__BIND: '0.0.0.0:8086'
      EMQX_LISTENERS__WS__DRAFTS__ENABLE_AUTHN: 'true'
      EMQX_LISTENERS__WS__DRAFTS__ZONE: default
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE_AUTHN: 'true'
      EMQX_LISTENERS__TCP__DEFAULT__ZONE: default
      EMQX_LISTENERS__WS__DEFAULT__ENABLE_AUTHN: 'false'
      EMQX_LISTENERS__WS__DEFAULT__ZONE: default
      EMQX_LISTENERS__SSL__DEFAULT__ENABLE: 'false'
      EMQX_LISTENERS__WSS__DEFAULT__ENABLE: 'false'
      EMQX_DASHBOARD__LISTENERS__HTTP__BIND: '0'
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: file
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: true
      EMQX_AUTHORIZATION__SOURCES__1__PATH: /opt/emqx/etc/acl.conf
    ports:
      - '127.0.0.1:${MQTT_WS_PORT:-8085}:8083'
      - '127.0.0.1:${MQTT_DRAFT_WS_PORT:-8086}:8086'
    networks:
      - mqtt
    volumes:
      - mqtt-data:/opt/emqx/data
      - mqtt-log:/opt/emqx/log
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - /opt/emqx/etc/production-entrypoint.sh
        - --healthcheck
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

networks:
  default:
    name: ${EXTERNAL_DOCKER_NETWORK:?请在 .env.prod 中设置 EXTERNAL_DOCKER_NETWORK}
    external: true
  mqtt:
    driver: bridge

volumes:
  mqtt-data:
  mqtt-log:
