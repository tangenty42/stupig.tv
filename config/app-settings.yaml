app:
  api:
    base: /api
  auth:
    jwt:
      expiresInDays: 14
      renewBeforeDays: 7
    session:
      maxAgeDays: 14
      maxTokenGenerations: 8
    cookie:
      maxAgeDays: 14
      tokenName: stupig_session
      userName: login
    bcryptRounds: 12
  otp:
    expiresMinutes: 10
    tier1:
      dailyLimit: 5
      cooldownMs: 60000
    tier2:
      dailyLimit: 5
      cooldownMs: 1800000
  identity:
    cookieName: stupig_identity
    cookieMaxAgeDays: 30
  client:
    colorMode:
      fallback: dark
      cookieName: stupig_color_mode
    timezone:
      cookieName: stupig_timezone
    sync:
      broadcastChannelName: stupig_sync_events
      clientIdStorageKey: stupig_sync_client_id
      eventDeduplicationLimit: 256
      resourceGatherDelayMs: 200
      reconnectDelayMs: 1000
      connectTimeoutMs: 30000
  online:
    timeoutSeconds: 16
    pingIdleIntervalSeconds: 4
    pollIntervalSeconds: 4
  admin:
    pollIntervalSeconds: 2
  avatar:
    maxSizeMb: 1
  content:
    story:
      titleMaxLength: 60
      labelMaxBytes: 255
      descMaxBytes: 500
      coverMaxBytes: 255
      markdownMaxBytes: 1048576
    link:
      fileNameMaxBytes: 255
    draft:
      schemaVersion: 3
      storagePrefix: stupig_content_draft_
      autosaveDelayMs: 1000
    reference:
      journalRetentionDays: 30
      sweepIntervalSeconds: 60
    workspace:
      batchLimit: 500
      draftReferenceLimit: 10000
      suffixAttempts: 10000
      receiptHours: 24
      sessionHours: 24
      leaseSeconds: 120
      heartbeatSeconds: 30
      parallelUploads: 3
    name:
      suffixSeparator: _
    upload:
      requestTimeoutSeconds: 120
      handleStorageName: stupig_content_upload_handles
      partSizeMb: 8
      signBatchSize: 20
      urlTtlSeconds: 900
      maxSizeMb: 20480
    download:
      urlTtlSeconds: 300
    read:
      urlTtlSeconds: 3600
    redact:
      maxDimension: 8192
    imageEditor:
      maxPixels: 24000000
      maxActions: 200
      maxStrokePoints: 100000
    image:
      lqipMaxBytes: 8192
    # 加解密是整块 buffer 处理（AES-GCM 单 tag 认证整段，不能流式），这个上限就是
    # 它的内存/耗时边界：只挡加密入口——现存每一份密文都出自 ≤ 该值的明文，解密天然
    # 在界内。调大它等于放宽整块处理的边界，需要连同解密内存一起评估。
    encrypt:
      maxSizeMb: 20

integrations:
  mqtt:
    qos: 1
    topicPrefix: stupig/sync
    clientIdPrefixServer: server
    clientIdPrefixWeb: web
    publishQueueSize: 100
  bilibili:
    fetchTimeoutMs: 5000
    cacheTtlMs: 86400000
    negativeCacheTtlMs: 1800000
    fetchFailureCooldownMs: 1800000
    fetchFailureMaxCooldownMs: 21600000
    retryJitterRatio: 0.2
