# 开发环境覆盖。只写与 default.yaml 不同的项，深度合并。
# 主机名、端口等连接信息全部在 .env（见 .env.example），default.yaml 经
# ${VAR} 插值引用；改端口只改 .env。本机特有的其他覆盖请写在
# config/local.yaml（不进仓库，优先级最高），模板见 config/local.example.yaml。

# MySQL 密码与 docker-compose.dev.yml 创建容器时注入的 ${MYSQL_PASSWORD}
# 是同一变量，两边天然一致；Redis 容器无密码。
redis:
  password: ''

oss:
  bucket: static-stupig-tv-dev

site:
  url: http://localhost:${APP_PORT}
  indexable: false
  staticBaseUrl: https://stupig-dev.oss.tangenty.cn

app:
  otp:
    debug: true
