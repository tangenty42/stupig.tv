# 所有环境共享的基础配置。敏感值不写在 YAML 里，用 ${VAR} 引用 .env 中的
# 环境变量；${VAR:-} 表示可选、缺省为空字符串。
# 环境差异写在 development.yaml / production.yaml，深度合并覆盖本文件。

db:
  host: ${MYSQL_HOST}
  port: ${MYSQL_PORT}
  user: stupig_tv
  password: ${MYSQL_PASSWORD}
  name: stupig_tv

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD:-}

mqtt:
  host: ${MQTT_HOST}
  port: ${MQTT_TCP_PORT}
  username: ${MQTT_USERNAME:-}
  password: ${MQTT_PASSWORD:-}
  qos: 1
  topicPrefix: stupig/sync
  clientIdPrefixServer: server
  # 服务端事件在 broker 不可达时的排队上限，溢出丢弃最旧事件并记日志
  publishQueueSize: 100
  # 浏览器端 WebSocket 连接信息（会下发到客户端）。
  # 完整 URL：生产经反代+SSL（wss://mqtt.example.com/mqtt，无需端口），
  # 开发直连本机（ws://localhost:8083/mqtt）
  web:
    wsUrl: ${MQTT_WEB_URL}
    clientIdPrefix: web

oss:
  endpoint: https://cn-nb1.rains3.com
  region: cn-nb1
  bucket: static-stupig-tv
  accessKeyId: ${OSS_ACCESS_KEY_ID}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET}
  forcePathStyle: false

aliyun:
  accessKeyId: ${ALIYUN_ACCESS_KEY_ID}
  accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET}
  dypns:
    endpoint: dypnsapi.aliyuncs.com
    regionId: cn-hongkong
  sms:
    signName: 速通互联验证服务
    templateCode: '100001'
    schemeName: 蠢猪小组官网
  captcha:
    # appId 会下发到浏览器；appKey 仅服务端验签使用
    appId: 804af2e773219386ce8ff865dac64fbe
    appKey: ${ALIYUN_CAPTCHA_APP_KEY:-}

site:
  url: https://www.stupig.tv
  # 生产由 dev 模式进程提供服务，索引开关无法依赖 NODE_ENV，必须显式声明
  indexable: true
  staticBaseUrl: https://stupig.oss.tangenty.cn

app:
  api:
    base: /api

  auth:
    jwt:
      secret: ${JWT_SECRET}
      # token 有效期（天）。续期窗口内的 token 会在请求时换发，因此下游所有
      # 存活期都必须覆盖它和 renewBeforeDays 之间的差距（见 config.ts 校验）
      expiresInDays: 14
      renewBeforeDays: 7
    session:
      # 空闲窗口：这么久没有任何请求则会话失效；活跃会话不设总寿命上限
      maxAgeDays: 14
      # 会话存活期内 token 代数的上限。停留在旧代数的客户端会在每次认证请求时
      # 被换发新 token（在线心跳持续轮询），所以代数必须有天花板
      maxTokenGenerations: 8
    cookie:
      maxAgeDays: 14
      tokenName: stupig_session
      userName: login
    bcryptRounds: 12

  otp:
    expiresMinutes: 10
    debug: false
    tier1:
      dailyLimit: 5
      cooldownMs: 60000
    tier2:
      dailyLimit: 5
      cooldownMs: 1800000

  identity:
    cookieName: stupig_identity
    cookieMaxAgeDays: 30

  colorMode:
    fallback: dark
    cookieName: stupig_color_mode

  timezone:
    cookieName: stupig_timezone

  sync:
    broadcastChannelName: stupig_sync_events
    clientIdStorageKey: stupig_sync_client_id

  online:
    timeoutSeconds: 16
    pingIdleIntervalSeconds: 4
    pollIntervalSeconds: 4

  avatar:
    maxSizeMb: 1

  content:
    story:
      titleMaxLength: 60
      labelMaxBytes: 255
      descMaxBytes: 500
      coverMaxBytes: 255
      # markdown 是 mediumtext 列，上限 16777215 字节
      markdownMaxBytes: 1048576
    link:
      fileNameMaxBytes: 255
    draft:
      schemaVersion: 2
      storagePrefix: stupig_content_draft_
      autosaveDelayMs: 1000
    upload:
      handleStorageName: stupig_content_upload_handles
      # 分片上传的片大小（MiB）。小于等于此值的文件走单次 PUT，避免为小文件
      # 付出 multipart 的三次往返
      partSizeMb: 8
      # 单次预签的分片数上限：预签 URL 有有效期，一次签完整批会在超长文件上过期
      signBatchSize: 20
      # 预签上传 URL 的有效期（秒）。分片 URL 与单次 PUT URL 共用；短窗口足够
      # 上传，过期后客户端重新预签即可
      urlTtlSeconds: 900
      # 单文件大小上限（MiB）。分片大小 × 最大分片数 = 80 GiB 的协议上限，
      # 这里取一个更保守的业务上限，挡住"客户端声明 10 TB"这类荒谬输入
      maxSizeMb: 20480
    download:
      # 附件下载签名 URL 的有效期（秒）。签名只在点击下载那一刻签发，过期后
      # 重新点击即可再签，短窗口足够一次下载开始
      urlTtlSeconds: 300
    redact:
      # 删减版编辑器解码到 canvas 的最长边。文件大小限制约束不了解码后的体积，
      # 小 PNG 也可能耗尽标签页内存
      maxDimension: 8192
    operationLock:
      # 作用域附件操作锁的租约。必须长于最慢的结构变更（移动文件夹会逐行重写
      # 其下所有行），否则租约中途过期会被第二个请求抢占。任务路径锁共用此值
      ttlSeconds: 120
    task:
      # runner 的心跳/锁续期间隔。必须短于 operationLock.ttlSeconds（见
      # config.ts 的交叉校验），否则锁会在两次心跳之间过期
      heartbeatSeconds: 30
      # 排队超时：锁长期被占用时任务放弃
      queuedTimeoutSeconds: 300
      # 终态任务保留期（小时）：断点续传与审计窗口
      retentionHours: 24
      # sweeper 间隔：回收过期锁、清算中断任务与残留上传
      sweepIntervalSeconds: 60
      # 浏览器侧"安装实例 ID"的 localStorage 键名。用途仅是"本机可续传"提示，
      # 不是授权边界；与 sync 的 sessionStorage 客户端 ID 有意分开（后者每标签页
      # 一个，刷新/换标签页就认不出自己）
      clientIdStorageName: stupig_content_task_client_id
    encrypt:
      # 单文件加密上限（MiB）。加解密在服务端整块处理（读整对象 → 内存转换 →
      # 整块写回，见 lib/attachment-crypto.ts），所以这个值就是该路径的内存与
      # 耗时的上限——调大它需要先把转换改成流式（AES-GCM 单 tag 认整段，格式
      # 会变，历史密文不兼容）。解密不校验此值：现存密文都出自这条加密路径。
      maxSizeMb: 20
    bilibili:
      fetchTimeoutMs: 5000
      cacheTtlMs: 86400000
      negativeCacheTtlMs: 300000
      fetchFailureCooldownMs: 300000
