# 所有环境共享的服务端配置。稳定且需在浏览器共享的业务参数仍以
# config/app-settings.yaml 为准。密钥通过显式 ${VAR} 从环境变量注入。
# 加载顺序：本文件 -> {NODE_ENV}.yaml -> development 下可选的 local.yaml。

db:
  host: ${MYSQL_HOST}
  port: ${MYSQL_PORT}
  user: ${MYSQL_USER:-stupig_tv}
  password: ${MYSQL_PASSWORD}
  name: ${MYSQL_DATABASE:-stupig_tv}

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD:-}

mqtt:
  host: ${MQTT_HOST}
  port: ${MQTT_TCP_PORT}
  username: ${MQTT_USERNAME:-}
  password: ${MQTT_PASSWORD:-}
  # 浏览器端 WebSocket 连接信息（会下发到客户端）。
  # 完整 URL：生产经反代+SSL（wss://mqtt.example.com/mqtt，无需端口），
  # 开发直连本机（ws://localhost:8083/mqtt）
  web:
    wsUrl: ${MQTT_WEB_URL}

oss:
  endpoint: https://cn-nb1.rains3.com
  region: cn-nb1
  bucket: static-stupig-tv
  accessKeyId: ${OSS_ACCESS_KEY_ID}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET}
  forcePathStyle: false

aliyun:
  accessKeyId: ${ALIYUN_ACCESS_KEY_ID}
  accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET}
  dypns:
    endpoint: dypnsapi.aliyuncs.com
    regionId: cn-hongkong
  sms:
    signName: 速通互联验证服务
    templateCode: '100001'
    schemeName: 蠢猪小组官网
  captcha:
    # appId 会下发到浏览器；appKey 仅服务端验签使用
    appId: 804af2e773219386ce8ff865dac64fbe
    appKey: ${ALIYUN_CAPTCHA_APP_KEY:-}

site:
  url: https://www.stupig.tv
  indexable: false
  staticBaseUrl: https://stupig.oss.tangenty.cn

app:
  auth:
    jwt:
      secret: ${JWT_SECRET}
  otp:
    debug: ${NUXT_OTP_DEBUG:-false}
