# 持续集成检查：lint + typecheck + 单测 + 迁移全量重放。
#
# 背景：deploy.yml 只有构建部署，迁移 SQL 过去要到生产容器启动时才第一次被
# 验证。本工作流把验证前置到合入前：
#   - check：与本地一致的 pnpm lint / nuxt typecheck / pnpm test；
#   - migrations：对全新 MySQL 8.4 从空库跑完整迁移链，再跑第二遍验证
#     执行器的"全部已应用"幂等路径，最后用 information_schema 断言结构落地。
#
# 分支保护：check / migrations 已设为 main 的必需状态检查（见仓库 Ruleset）。
# 参考 schema 的 drift 对比已不再需要——`migrations/` 本身就是唯一事实源。

name: Check

on:
  push:
    branches: [main]
  pull_request:

# 同一分支新提交取消旧的检查运行；部署工作流有自己的 concurrency，不受影响
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# 与迁移无关的密钥给占位值：load_config 会校验 config/*.yaml 引用的全部
# 无默认值插值变量，测试与迁移的 import 链都会触发（测试本身 mock 掉 db 等
# 边界，这些值从不真正使用）。NODE_ENV 不在这里设——vitest 默认用 test，
# 只有迁移步骤需要 production（避开 development.yaml 的 ${APP_PORT} 插值）。
env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: '3306'
  MYSQL_PASSWORD: ci-mysql-password
  JWT_SECRET: ci-jwt-secret-not-a-real-secret-32ch
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: '6379'
  MQTT_HOST: 127.0.0.1
  MQTT_TCP_PORT: '1883'
  MQTT_WEB_URL: ws://localhost:8083/mqtt
  OSS_ACCESS_KEY_ID: ci-oss-key-id
  OSS_ACCESS_KEY_SECRET: ci-oss-key-secret
  ALIYUN_ACCESS_KEY_ID: ci-aliyun-key-id
  ALIYUN_ACCESS_KEY_SECRET: ci-aliyun-key-secret

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 版本在这里显式指定，不写进 package.json 的 packageManager 字段：
      # 该字段会让 pnpm 尝试把 packageManagerDependencies 同步进 lockfile，
      # 与 --frozen-lockfile 冲突（Dockerfile 的 corepack 路径同理）
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # 不带 --ignore-scripts：postinstall 的 nuxt prepare 是 typecheck 的前置
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: npx nuxt typecheck

      - run: pnpm test

  migrations:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          # 与应用配置（config/default.yaml 的 db.user/db.name）对齐
          MYSQL_DATABASE: stupig_tv
          MYSQL_USER: stupig_tv
          MYSQL_PASSWORD: ci-mysql-password
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # NODE_ENV=production 避开 development.yaml 的 site.url（${APP_PORT}）插值
      - name: Apply migrations on a fresh database
        env:
          NODE_ENV: production
        run: |
          pnpm migrate
          # 第二遍：全部已记录，应直接判 up to date（执行器幂等路径）
          pnpm migrate
          pnpm migrate --status

      - name: Verify schema landed
        run: |
          # 关键结构断言（数量断言太脆，每次迁移都要改）：
          # 任务队列三表已就位、旧 scope 锁表已移除
          for TABLE in content_locks content_tasks content_task_items; do
            FOUND=$(mysql -h 127.0.0.1 -P 3306 -u stupig_tv -pci-mysql-password stupig_tv \
              -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = 'stupig_tv' AND TABLE_NAME = '$TABLE'")
            if [ "$FOUND" != "1" ]; then
              echo "missing table: $TABLE"
              exit 1
            fi
          done
          OLD=$(mysql -h 127.0.0.1 -P 3306 -u stupig_tv -pci-mysql-password stupig_tv \
            -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = 'stupig_tv' AND TABLE_NAME = 'content_operation_locks'")
          if [ "$OLD" != "0" ]; then
            echo "content_operation_locks should be dropped, got $OLD"
            exit 1
          fi
          mysql -h 127.0.0.1 -P 3306 -u stupig_tv -pci-mysql-password stupig_tv \
            -e "SELECT filename, applied_at FROM schema_migrations ORDER BY filename"
