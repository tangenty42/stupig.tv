# 持续集成检查：lint + typecheck + 单测 + 迁移全量重放。
#
# 背景：deploy.yml 只有构建部署，迁移 SQL 过去要到生产容器启动时才第一次被
# 验证。本工作流把验证前置到合入前：
#   - check：与本地一致的 pnpm lint / nuxt typecheck / pnpm test；
#   - migrations：对全新 MySQL 8.4 从空库跑完整迁移链，再跑第二遍验证
#     执行器的"全部已应用"幂等路径，最后用 information_schema 断言结构落地；
#   - browser：真实浏览器端到端，按 `--shard` 拆成三个 job 并行；
#   - mqtt：生产 broker 镜像的权限与持久化；
#   - changes：识别纯文档 PR，以及可安全复用的 PR 检查结果。
#   - verified tree：仅在 PR 的所有应用检查通过时记录实际测试的代码树。
#
# PR 的跳过只能落在 job 的条件上，不能加 `on.pull_request.paths`：工作流因路径过滤
# 而不触发时，它负责的必需检查会永远停在 "Waiting for status to be reported"，
# PR 再也合不进去。被 `if` 跳过的 job 在分支保护里按成功上报。
#
# 分支保护：check / migrations 已设为 main 的必需状态检查（见仓库 Ruleset）。
# 参考 schema 的 drift 对比已不再需要——`migrations/` 本身就是唯一事实源。

name: Check

on:
  push:
    branches:
      - main
    # 纯文档 push 不启动 Check，也不会触发监听 Check 的 Deploy；PR 不加路径过滤。
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:

# 同一分支新提交取消旧的检查运行；部署工作流有自己的 concurrency，不受影响
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# 迁移只需要数据库变量；单测在各自边界提供夹具，不依赖其他部署密钥。
env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: '3306'
  MYSQL_USER: stupig_tv
  MYSQL_DATABASE: stupig_tv
  MYSQL_PASSWORD: ci-mysql-password

jobs:
  # 只判断"这次改动是否需要跑应用测试"，本身不验证任何东西。main 上复用
  # 成功的 PR 结果时保留该 job：Deploy 以本次 Check 的完成事件为触发条件。
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tree: ${{ steps.classify.outputs.tree }}
      reuse: ${{ steps.classify.outputs.reuse }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 需要 base commit 才能算出 PR 实际改了什么；仓库不大，全量克隆更省事。
          fetch-depth: 0

      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "tree=$(git rev-parse "$GITHUB_SHA^{tree}")" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            node scripts/ci/reuse-pr-checks.mjs
            exit 0
          fi
          # 判断不了差异就当作代码改动，宁可多跑一次也不跳过验证。
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          printf 'changed files:\n%s\n' "$changed"
          # 只有 docs/ 与 Markdown 无法影响应用、schema 或工具链。
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-24.04
    needs: changes
    # 仅跳过纯文档 PR 或已确认与 PR 测试代码树一致的 main；检测失败时退回全量。
    if: "!cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.reuse != 'true'"
    steps:
      - uses: actions/checkout@v5

      # 版本在这里显式指定，不写进 package.json 的 packageManager 字段：
      # 该字段会让 pnpm 尝试把 packageManagerDependencies 同步进 lockfile，
      # 与 --frozen-lockfile 冲突（Dockerfile 的 corepack 路径同理）
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # 不带 --ignore-scripts：postinstall 的 nuxt prepare 是 typecheck 的前置
      - run: pnpm install --frozen-lockfile

      - name: Check generated settings
        run: |
          pnpm settings:check
          git diff --exit-code -- server/shared/settings.generated.ts

      - run: pnpm lint

      - run: npx nuxt typecheck

      - run: pnpm exec tsc --project scripts/tsconfig.json --noEmit

      - run: pnpm exec tsc --project tests/tsconfig.json --noEmit

      - run: pnpm test

  mqtt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: "!cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.reuse != 'true'"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build production MQTT image
        run: docker build --target mqtt -t stupig-mqtt-ci:local .
      - name: Verify production MQTT permissions and persistence
        env:
          STUPIG_EMQX_IMAGE: stupig-mqtt-ci:local
        run: pnpm exec vitest run --project tools scripts/deploy/emqx.integration.test.ts

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: "!cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.reuse != 'true'"
    strategy:
      # 分片彼此独立；一片失败不应把仍在跑的分片当作噪音取消。
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    name: browser (${{ matrix.shard }}/3)
    env:
      NODE_ENV: development
      MYSQL_DEV_ROOT_PASSWORD: ci-root-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      MQTT_HOST: 127.0.0.1
      MQTT_TCP_PORT: '1883'
      MQTT_WS_PORT: '8083'
      MQTT_WEB_URL: ws://localhost:8083/mqtt
    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: '%'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mqtt:
        image: emqx/emqx:6.2.2
        ports:
          - 1883:1883
          - 8083:8083
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 浏览器包按 Playwright 版本缓存；系统依赖仍由 --with-deps 每次确认，
      # 因此缓存过期只会多下载，不会让分片跑在缺库的 runner 上。
      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium

      # 分片各占一个端口（见 scripts/testing/e2e-target.ts），并行运行不会互相
      # 端口冲突，也不会共享数据库或 MQTT 主题。
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .dev/playwright/
            .dev/e2e/**/server.log

  migrations:
    runs-on: ubuntu-24.04
    needs: changes
    if: "!cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.reuse != 'true'"

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          # 与应用数据库默认账号和库名对齐
          MYSQL_DATABASE: stupig_tv
          MYSQL_USER: stupig_tv
          MYSQL_PASSWORD: ci-mysql-password
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply migrations on a fresh database
        env:
          NODE_ENV: production
          # Frozen Content scripts validate their destination even on an empty
          # database. No objects exist here; these are schema-only identities.
          ALIYUN_OSS_ACCESS_KEY_ID: qa-local-only
          ALIYUN_OSS_ACCESS_KEY_SECRET: qa-local-only
        run: |
          pnpm migrate --maintenance
          # 第二遍：全部已记录，应直接判 up to date（执行器幂等路径）
          pnpm migrate
          pnpm migrate --status

      - name: Verify schema landed
        run: |
          # 关键结构断言（数量断言太脆，每次迁移都要改）：
          # 任务队列三表已就位、旧 scope 锁表已移除
          for TABLE in content_locks content_tasks content_task_items migration_runs storage_audit_targets storage_audit_findings; do
            FOUND=$(mysql -h 127.0.0.1 -P 3306 -u stupig_tv -pci-mysql-password stupig_tv \
              -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = 'stupig_tv' AND TABLE_NAME = '$TABLE'")
            if [ "$FOUND" != "1" ]; then
              echo "missing table: $TABLE"
              exit 1
            fi
          done
          OLD=$(mysql -h 127.0.0.1 -P 3306 -u stupig_tv -pci-mysql-password stupig_tv \
            -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = 'stupig_tv' AND TABLE_NAME = 'content_operation_locks'")
          if [ "$OLD" != "0" ]; then
            echo "content_operation_locks should be dropped, got $OLD"
            exit 1
          fi
          mysql -h 127.0.0.1 -P 3306 -u stupig_tv -pci-mysql-password stupig_tv \
            -e "SELECT filename, finished_at FROM migration_runs WHERE status = 'completed' ORDER BY filename"
          LEGACY=$(mysql -h 127.0.0.1 -P 3306 -u stupig_tv -pci-mysql-password stupig_tv \
            -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = 'stupig_tv' AND TABLE_NAME = 'schema_migrations'")
          test "$LEGACY" = "0"

      - name: Verify script recovery on isolated databases
        env:
          NODE_ENV: development
          MYSQL_DEV_ROOT_PASSWORD: ci-root-password
        run: pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/verify/migration-runtime.ts

      - name: Verify Content conversion on an isolated database
        env:
          NODE_ENV: development
          MYSQL_DEV_ROOT_PASSWORD: ci-root-password
          # The verifier uses in-memory OSS; these are schema-only fixtures.
          ALIYUN_OSS_ACCESS_KEY_ID: qa-local-only
          ALIYUN_OSS_ACCESS_KEY_SECRET: qa-local-only
        run: pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/verify/content-migration.ts

  verified-tree:
    name: verified-tree
    needs:
      - changes
      - check
      - mqtt
      - browser
      - migrations
    if: "github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' && needs.check.result == 'success' && needs.mqtt.result == 'success' && needs.browser.result == 'success' && needs.migrations.result == 'success'"
    runs-on: ubuntu-24.04
    steps:
      - name: verified-tree-${{ needs.changes.outputs.tree }}
        run: echo 'All application checks passed for the PR merge tree.'
