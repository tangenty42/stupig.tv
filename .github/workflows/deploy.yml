name: Deploy

on:
  workflow_run:
    workflows:
      - Check
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build and push image
        run: |
          IMAGE="${{ vars.ACR_IMAGE }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${IMAGE%%/*}" \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin
          # 只推 :latest：个人项目不指望镜像级回滚（回滚 = 重跑旧 commit 的 workflow），
          # 免得 ACR 里积一堆 :sha tag
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"

      # 只能 prune -f（清悬空镜像）。严禁改成 -a：这台主机与 1panel 共用，
      # -a 会删掉其他站点正在用的镜像（它们对 docker 而言"未使用"，却是别的
      # 站点的运行基础），且被删的往往是从上游拉不到的历史镜像，无法恢复。
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.SSH_PORT }}" -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          test -n "$ENV_PASSPHRASE" || { echo "Missing ENV_PASSPHRASE repository secret" >&2; exit 1; }
          # .env.prod 由本地 gpg 对称加密提交（scripts/gpg-env.ts）：runner 用
          # ENV_PASSPHRASE 解密后直送服务器，服务器上不构建 .env；
          # deploy-remote.sh 只校验没有 <required> 残留。
          gpg --batch --yes --pinentry-mode loopback --passphrase "$ENV_PASSPHRASE" --decrypt \
            --output .env.prod .env.prod.gpg
          scp -P "${{ vars.SSH_PORT }}" .env.prod \
            "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_DIR }}/.env.incoming"
          shred -u .env.prod
          # 仓库里的 compose 是线上编排的唯一来源：先送过去，由远端脚本校验后换到位
          # （旧的备份成 docker-compose.yml.bak）。以前这份文件只在服务器上，会悄悄
          # 漂移（探针探 /、缺 container_name），而仓库里那份看起来是好的。
          scp -P "${{ vars.SSH_PORT }}" docker-compose.yml \
            "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_DIR }}/docker-compose.yml.incoming"
          # 远端序列在 scripts/deploy-remote.sh：SSH → 远端 shell 的两层引号转义本身就是
          # 事故来源，脚本可以在本地用替身 docker 跑（scripts/deploy-remote.test.ts）。
          # 它内部带健康门：容器起不来就回滚到旧镜像，并让这一步红掉。
          ssh -p "${{ vars.SSH_PORT }}" "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            "DEPLOY_DIR='${{ vars.DEPLOY_DIR }}' \
             IMAGE='$IMAGE' \
             ACR_USERNAME='${{ secrets.ACR_USERNAME }}' \
             ACR_PASSWORD='${{ secrets.ACR_PASSWORD }}' \
             sh -s" \
            < scripts/deploy-remote.sh
