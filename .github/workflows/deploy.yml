name: Deploy

on:
  workflow_run:
    workflows:
      - Check
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    # workflow_run 的 branches 过滤按触发 run 的 head 分支名匹配，而 fork 的默认分支
    # 同样叫 main：纯文档 fork PR 的 Check（必需 job 全部跳过=成功）也能穿过该过滤，
    # 使本工作流在默认分支上下文（全量 secrets、root SSH）执行 fork 的代码。
    # 因此限定 push 事件且触发 run 必须来自本仓库。
    if: "github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install publish tools
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check registry credentials
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -eu
          : "${ACR_USERNAME:?Missing ACR_USERNAME repository secret}"
          : "${ACR_PASSWORD:?Missing ACR_PASSWORD repository secret}"

      - name: Check SSH host identity
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          set -eu
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS repository secret}"
          : "${SSH_HOST:?Missing SSH_HOST repository variable}"
          : "${SSH_PORT:?Missing SSH_PORT repository variable}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ "$SSH_PORT" = 22 ]; then host_entry="$SSH_HOST"; else host_entry="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$host_entry" -f ~/.ssh/known_hosts >/dev/null || {
            echo 'SSH_KNOWN_HOSTS has no entry for the configured host and port' >&2
            exit 1
          }

      - name: Decrypt production environment
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        run: |
          test -n "$ENV_PASSPHRASE" || { echo "Missing ENV_PASSPHRASE repository secret" >&2; exit 1; }
          umask 077
          printf '%s' "$ENV_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt \
            --output .env.prod .env.prod.gpg

      - name: Check production ESA target
        run: pnpm esa:deploy:prod --check

      - name: Prepare server environment
        run: pnpm exec tsx scripts/deploy/runtime-env.ts

      - name: Build and push image
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          IMAGE="${{ vars.ACR_IMAGE }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          printf '%s' "$ACR_PASSWORD" | docker login "${IMAGE%%/*}" \
            -u "$ACR_USERNAME" --password-stdin
          # 只推 :latest / :mqtt：个人项目的历史版本回退仍靠重跑旧 commit 的 workflow，
          # 免得 ACR 里积一堆 :sha tag
          docker build --target mqtt -t "$IMAGE:mqtt" .
          docker push "$IMAGE:mqtt"
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"

      # 只能 prune -f（清悬空镜像）。严禁改成 -a：这台主机与 1panel 共用，
      # -a 会删掉其他站点正在用的镜像（它们对 docker 而言"未使用"，却是别的
      # 站点的运行基础），且被删的往往是从上游拉不到的历史镜像，无法恢复。
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host *\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          # 服务器只接收运行配置；ESA 发布凭据留在 runner。
          sh scripts/deploy/stage-env.sh .env.prod.runtime
          # 仓库里的 compose 是线上编排的唯一来源：先送过去，由远端脚本校验后换到位
          # （旧的备份成 docker-compose.yml.bak）。以前这份文件只在服务器上，会悄悄
          # 漂移（探针探 /、缺 container_name），而仓库里那份看起来是好的。
          scp -P "${{ vars.SSH_PORT }}" docker-compose.yml \
            "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_DIR }}/docker-compose.yml.incoming"
          # 远端序列在 scripts/deploy/remote.sh：SSH → 远端 shell 的两层引号转义本身就是
          # 事故来源，脚本可以在本地用替身 docker 跑（scripts/deploy/remote.test.ts）。
          # 它内部带健康门：容器起不来就回滚到旧镜像，并让这一步红掉。
          # 共用的 Registry 凭据通过加密 SSH stdin 传入，不拼进远端命令行。
          # base64 仅处理 shell 引号；传输保密由 SSH 提供。
          {
            printf 'ACR_USERNAME=$(printf %%s "%s" | base64 -d)\n' "$(printf '%s' "$ACR_USERNAME" | base64 -w0)"
            printf 'ACR_PASSWORD=$(printf %%s "%s" | base64 -d)\n' "$(printf '%s' "$ACR_PASSWORD" | base64 -w0)"
            cat scripts/deploy/remote.sh
          } | ssh -p "${{ vars.SSH_PORT }}" "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            "DEPLOY_DIR='${{ vars.DEPLOY_DIR }}' IMAGE='$IMAGE' sh -s"

      # 只有应用健康门通过，才发布本次 checkout 的 ESA 源码和变量。
      - name: Publish production ESA function
        run: pnpm esa:deploy:prod

      - name: Remove plaintext environment
        if: always()
        run: |
          if [ -f .env.prod ]; then shred -u .env.prod; fi
          if [ -f .env.prod.runtime ]; then shred -u .env.prod.runtime; fi

      - name: Upload ESA deployment receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: esa-production-receipt
          path: .data/esa-deploy/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
